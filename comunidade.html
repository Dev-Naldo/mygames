<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade - MY GAMES</title>
    <!-- Importação do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

    <!-- Menu (Navbar Bootstrap) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">MyGames Community</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Voltar ao Início</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Alerta Bootstrap -->
        <div class="alert alert-info alert-dismissible fade show" role="alert">
            <strong>Novidade!</strong> O fórum da comunidade foi atualizado hoje.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="row mt-4">
            <!-- Formulário Bootstrap -->
            <div class="col-md-6 mb-4">
                <div class="card bg-secondary text-light">
                    <div class="card-body">
                        <h5 class="card-title">Criar Tópico</h5>
                        <form>
                            <div class="mb-3">
                                <label for="tituloTopico" class="form-label">Título</label>
                                <input type="text" class="form-control" id="tituloTopico" required>
                            </div>
                            <div class="mb-3">
                                <label for="mensagemTopico" class="form-label">Mensagem</label>
                                <textarea class="form-control" id="mensagemTopico" rows="3" required></textarea>
                            </div>
                            <!-- Botão Bootstrap -->
                            <button type="submit" class="btn btn-primary">Publicar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Cards Bootstrap -->
            <div class="col-md-6">
                <div class="card bg-secondary text-light mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Discussão: Melhor RPG do ano</h5>
                        <p class="card-text">Participe da votação sobre os indicados ao prêmio.</p>
                        <a href="#" class="btn btn-outline-light btn-sm">Ver Tópico</a>
                    </div>
                </div>
                <div class="card bg-secondary text-light">
                    <div class="card-body">
                        <h5 class="card-title">Dicas de Hollow Knight</h5>
                        <p class="card-text">Onde encontrar todos os amuletos escondidos.</p>
                        <a href="#" class="btn btn-outline-light btn-sm">Ver Tópico</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts do Bootstrap para fechar o alerta -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
